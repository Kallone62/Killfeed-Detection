name: Detector offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source integrity, CLI, and public security boundary
        run: |
          python -m compileall -q detect.py rev12
          python -m unittest discover -s tests -v
